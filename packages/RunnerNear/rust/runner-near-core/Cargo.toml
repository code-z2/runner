[package]
name = "runner_near_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]
name = "runner_near_core"

[dependencies]
uniffi = { version = "=0.32.2", features = ["cli"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
hex = "0.4"
bs58 = "0.5"
near-api = "0.8.7"
# 1Click models only: the generated endpoint fns never attach partner auth,
# so transport stays in intents.rs (blocking, X-API-Key). Pinned rev; bump
# deliberately after reading the upstream diff.
one-click-sdk-rs = { git = "https://github.com/defuse-protocol/one-click-sdk-rs.git", rev = "f9741c3dcfe406dba2ce8c2ae73a6e025dbaafd9" }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = "1"
thiserror = "1"

[dev-dependencies]
hex = "0.4"

[profile.release]
strip = true
lto = true
